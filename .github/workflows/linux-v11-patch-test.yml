name: Linux v1.1 patch exact-ref artifact

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Exact commit SHA to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      T3CODE_RELAY_URL: ${{ secrets.PATCH_T3CODE_RELAY_URL }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ secrets.PATCH_T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ secrets.PATCH_T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ secrets.PATCH_T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_TELEMETRY_CHANNEL: dev
      BUILD_VERSION: 0.1.3-v1.1.1.20261026.22512a5.linux1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.build_ref }}"
          git status --short

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Build Linux arm64 AppImage
        run: vp run dist:desktop:artifact --platform linux --target AppImage --arch arm64 --build-version "$BUILD_VERSION" --verbose

      - name: Smoke AppImage version
        shell: bash
        run: |
          set -euo pipefail
          app=$(ls release/*.AppImage | head -n 1)
          chmod +x "$app"
          APPIMAGE_EXTRACT_AND_RUN=1 "$app" --version
          sha256sum "$app" | tee release/SHA256SUMS-linux-arm64-patch-test

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-arm64-v11-patch-22512a5
          path: |
            release/*.AppImage
            release/SHA256SUMS-linux-arm64-patch-test
          if-no-files-found: error
          retention-days: 1
